<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1rem;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            margin-bottom: 1rem;
            padding: 0.5rem;
            font-size: 1rem;
        }

        button {
            padding: 0.6rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .errorlist {
            color: red;
            margin-bottom: 1rem;
            list-style: none;
            padding: 0;
        }

        .helptext {
            font-size: 0.8rem;
            color: gray;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create an Account</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <label for="id_username">Username</label>
            {{ form.username.errors }}
            {{ form.username }}

            <label for="id_password1">Password</label>
            {{ form.password1.errors }}
            {{ form.password1 }}
            <div class="helptext">{{ form.password1.help_text }}</div>

            <label for="id_password2">Confirm Password</label>
            {{ form.password2.errors }}
            {{ form.password2 }}

            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
